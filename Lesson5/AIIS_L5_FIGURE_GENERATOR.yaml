task:
  id: AIIS_L5_FIGURE_GENERATOR_V1
  title: Generate AIIS_L5 Master Summary Thumbnail (5x4 Grid, Default 煥哥 + Excalidraw, 繁體中文)
  role: >
    Expert instructional designer, domain educator,
    presentation visual designer, and AI infographic art director.

lesson:
  id: AIIS_L5
  domain: AI & Information Security (AIIS)
  full_name: "LEARN — Supervised ML I：Classification Foundations"
  chinese_name: "監督式學習 (一)：分類基石、特徵工程與資安遙測分類"
  core_slogan: "DATA IS THE TRUTH. FEATURES ARE THE LENS. HUMAN VERIFIES."
  
composition:
  role: "role-1 (煥哥 Huange - Official 2026 AAIS Master Instructor)"
  style: "style-1 (Excalidraw / Canva Hand-Drawn Infographic - Default, 繁體中文)"
  layout: "layout-1 (5 columns × 4 rows = 20 Panels)"
  aspect_ratio: "16:9"

panels:
  # Row 1: ML Foundations & Toolchain (01 - 05)
  - id: 1
    title: "AIIS_L5 封面"
    subtitle: "LEARN — Supervised ML I: Classification"
    type: "cover"
    avatar: "huange_portrait.png"
    callout: "Welcome to AIIS_L5!"

  - id: 2
    title: "課程大綱"
    subtitle: "8-Step Supervised ML Roadmap"
    type: "agenda"
    bullets:
      - "1. 從規則防禦邁向機器學習"
      - "2. 監督式學習核心定義"
      - "3. 特徵 (Features) 與 標籤 (Labels)"
      - "4. 資料集切分：Train vs. Test"
      - "5. 邏輯回歸 (Logistic Regression)"
      - "6. K-近鄰演算法 (KNN)"
      - "7. 基準評估與過擬合 (Overfitting)"
      - "8. 資安特徵工程實戰"
    avatar: "avatar_welcome.png"
    callout: "開啟 AI 智慧資安之門！"

  - id: 3
    title: "核心大哉問：規則寫得完嗎？"
    subtitle: "Why We Need Machine Learning in Security"
    type: "concept"
    avatar: "avatar_idea.png"
    callout: "規則應對已知，ML 捕捉未知！"

  - id: 4
    title: "ML 核心工具鏈"
    subtitle: "Python, pandas, scikit-learn & numpy"
    type: "toolchain"
    avatar: "avatar_laptop.png"

  - id: 5
    title: "資料前處理與清洗"
    subtitle: "Data Cleaning, Normalization & Encoding"
    type: "setup"
    avatar: "avatar_explain.png"

  # Row 2: Features, Labels & Data Pipeline (06 - 10)
  - id: 6
    title: "特徵工程：將資安日誌轉為向量"
    subtitle: "Security Telemetry -> Feature Vectors"
    type: "workflow"
    avatar: "avatar_laptop.png"

  - id: 7
    title: "標籤定義：正常 vs. 惡意"
    subtitle: "Binary Classification: Normal (0) vs Attack (1)"
    type: "showcase"
    avatar: "avatar_present.png"
    callout: "高質量的 Label 決定模型上限！"

  - id: 8
    title: "資料集切分：Train / Test Split"
    subtitle: "80% Training Data ↔ 20% Testing Data"
    type: "data"
    avatar: "avatar_welcome.png"

  - id: 9
    title: "模型一：邏輯回歸 (Logistic Regression)"
    subtitle: "Sigmoid Function & Probability Boundary"
    type: "turning_point"
    avatar: "avatar_inspect.png"
    callout: "機率決策分界線 (Decision Boundary)！"

  - id: 10
    title: "模型二：K-近鄰演算法 (KNN)"
    subtitle: "Distance Metrics & K-Nearest Neighbors"
    type: "asset"
    avatar: "avatar_inspect.png"
    callout: "物以類聚：用空間距離識別威脅！"

  # Row 3: Security Telemetry & Generalization (11 - 15)
  - id: 11
    title: "泛化能力 (Generalization)"
    subtitle: "Underfitting vs. Good Fit vs. Overfitting"
    type: "threat"
    avatar: "avatar_inspect.png"

  - id: 12
    title: "資安資料偏誤與假象"
    subtitle: "Data Leakage & Artifact Learning"
    type: "vuln"
    avatar: "avatar_explain.png"
    callout: "模型是學到攻擊特徵，還是資料假象？"

  - id: 13
    title: "Sigmoid 決策公式"
    subtitle: "P(Y=1|X) = 1 / (1 + e^-z)"
    type: "formula"
    formula: "P(Attack | Telemetry) = σ(W·X + b)"
    avatar: "avatar_idea.png"

  - id: 14
    title: "CIA 三要素在 ML 資料的實踐"
    subtitle: "Data Integrity & Label Quality"
    type: "cia"
    avatar: "avatar_welcome.png"
    callout: "Garbage In, Garbage Out!"

  - id: 15
    title: "模型效能初步對比矩陣"
    subtitle: "Logistic Regression vs. KNN Benchmark"
    type: "matrix"
    avatar: "avatar_laptop.png"

  # Row 4: Lab, AI Collaboration & Slogan (16 - 20)
  - id: 16
    title: "AI 輔助建模：調參與解釋"
    subtitle: "Using AI to Explain Weights & Features"
    type: "role_switch"
    avatar: "avatar_explain.png"
    callout: "AI 協助調參，人類驗證特徵！"

  - id: 17
    title: "實證原則：嚴禁 Data Leakage"
    subtitle: "Strict Train/Test Isolation"
    type: "epistemic"
    avatar: "avatar_inspect.png"
    callout: "測試集不可參與特徵工程！"

  - id: 18
    title: "AIIS_L5_LAB01 實戰建模"
    subtitle: "Train Phishing & Attack Classifier"
    type: "lab"
    avatar: "avatar_laptop.png"
    callout: "動手訓練第一個資安分類模型！"

  - id: 19
    title: "機器學習三部曲主線"
    subtitle: "L5 Foundations -> L6 Tree Models -> L7 Evaluation"
    type: "roadmap"
    roadmap: "L5 基礎分類 -> L6 決策樹與森林 -> L7 資安指標評估"
    avatar: "avatar_welcome.png"
    callout: "下一課：決策樹與隨機森林 (L6)！"

  - id: 20
    title: "總結金句：特徵為鏡，實證為本"
    subtitle: "Final Message & Closing"
    type: "closing"
    quote: "“DATA IS THE TRUTH. FEATURES ARE THE LENS. HUMAN VERIFIES.”"
    avatar: "huange_portrait.png"
    callout: "See you in AIIS_L6!"
