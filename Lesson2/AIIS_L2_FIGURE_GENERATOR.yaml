lesson:
  id: AIIS_L2
  domain: AI & Information Security (AIIS)
  full_name: "MANAGE — Spec-Driven AI Engineering (OpenSpec × Antigravity × Git × GitHub)"
  chinese_name: "工程管控：規格驅動開發、Git 變更審查與 GitHub 工程記憶"
  core_slogan: "SPEC DEFINES. AI IMPLEMENTS. HUMAN VERIFIES. GIT REMEMBERS."
  
composition:
  role: "role-1 (煥哥 Huange - Official 2026 AAIS Master Instructor)"
