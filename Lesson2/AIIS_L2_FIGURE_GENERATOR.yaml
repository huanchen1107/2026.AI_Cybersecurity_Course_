panels:
  # Row 1: The Engineering Management Journey (01 - 05)
  - id: 1
    title: "AIIS_L2 封面"
    subtitle: "MANAGE — Spec-Driven AI Engineering"
    type: "cover"
    avatar: "huange_portrait.png"
    callout: "Welcome to AIIS_L2!"

  - id: 2
    title: "課程大綱"
    subtitle: "8-Step Engineering Management Roadmap"
    type: "agenda"
    bullets:
      - "1. Prompt 為什麼不能作為工程合約？"
      - "2. 四層心智模型：DEFINE → BUILD → VERIFY → REMEMBER"
      - "3. OpenSpec 規格契約：需求、範疇與驗收標準"
      - "4. Antigravity 計畫先行：先出 Plan 再動 Code"
      - "5. 人類審查：核准 AI 計畫與邊界"
      - "6. 受控實作與 Git Diff 逐行審查"
      - "7. 執行驗證：依據 Acceptance Criteria 驗收"
      - "8. Git 提交與 GitHub 工程記憶溯源"
    avatar: "avatar_welcome.png"
    callout: "從對話寫扣邁向正規工程管控！"

  - id: 3
    title: "核心大哉問：Prompt 夠當工程合約嗎？"
    subtitle: "Vibe Coding vs. Spec-Driven Development"
    type: "concept"
    avatar: "avatar_idea.png"
    callout: "需求不能只存在對話紀錄裡！"

  - id: 4
    title: "工程管控核心工具鏈"
    subtitle: "OpenSpec × Antigravity × Git × GitHub"
    type: "toolchain"
    avatar: "avatar_laptop.png"

  - id: 5
    title: "四層工程思維模型"
    subtitle: "DEFINE → BUILD → VERIFY → REMEMBER"
    type: "setup"
    avatar: "avatar_explain.png"

  # Row 2: Specification & Controlled Implementation (06 - 10)
  - id: 6
    title: "OpenSpec 規格契約制定"
    subtitle: "Need + Scope + Acceptance Criteria"
    type: "workflow"
    avatar: "avatar_laptop.png"

  - id: 7
    title: "範疇邊界：In-Scope vs. Out-of-Scope"
    subtitle: "Defining Boundaries to Prevent Creep"
    type: "showcase"
    avatar: "avatar_present.png"
    callout: "明確界定不做什麼，專案才不會失控！"

  - id: 8
    title: "Antigravity 計畫先行機制"
    subtitle: "AI Proposes Plan Before Code Modification"
    type: "data"
    avatar: "avatar_welcome.png"

  - id: 9
    title: "人類審查 AI 計畫"
    subtitle: "Human Approves or Adjusts AI Proposal"
    type: "turning_point"
    avatar: "avatar_inspect.png"
    callout: "人類決定，AI 執行！"

  - id: 10
    title: "受控實作：拒絕無理由改動"
    subtitle: "Minimal, Scope-Compliant Code Modification"
    type: "asset"
    avatar: "avatar_inspect.png"
    callout: "每一行變更都要符合規格！"

  # Row 3: Code Diff, Verification & Git Memory (11 - 15)
  - id: 11
    title: "Git Diff 逐行審查"
    subtitle: "Inspect File Changes (+ Additions / - Deletions)"
    type: "threat"
    avatar: "avatar_inspect.png"

  - id: 12
    title: "實施測試與逐項驗收"
    subtitle: "Verify Against Every Acceptance Criterion"
    type: "vuln"
    avatar: "avatar_explain.png"
    callout: "逐條勾選驗收標準，拒絕盲目信任！"

  - id: 13
    title: "工程四大金句公式"
    subtitle: "SPEC DEFINES. AI IMPLEMENTS. HUMAN VERIFIES. GIT REMEMBERS."
    type: "formula"
    formula: "Controlled Change = Spec + Plan + Diff + Test + Commit"
    avatar: "avatar_idea.png"

  - id: 14
    title: "Git Commit：不可磨滅的工程里程碑"
    subtitle: "Meaningful Commit Messages as Named Checkpoints"
    type: "cia"
    avatar: "avatar_welcome.png"
    callout: "Git 銘記每次工程決策！"

  - id: 15
    title: "變更溯源與版本回滾矩陣"
    subtitle: "Traceability & Rollback Safety Matrix"
    type: "matrix"
    avatar: "avatar_laptop.png"

  # Row 4: Lab, AI Collaboration & Slogan (16 - 20)
  - id: 16
    title: "GitHub 遠端同步與工程記憶"
    subtitle: "Shared Team Memory & Audit Trail"
    type: "role_switch"
    avatar: "avatar_explain.png"
    callout: "可追溯的雲端工程歷史！"

  - id: 17
    title: "實證原則：對話會消失，Git 永長存"
    subtitle: "AI Changes. Git Remembers. Human Decides."
    type: "epistemic"
    avatar: "avatar_inspect.png"
    callout: "真正的工程講求可重現性與證據！"

  - id: 18
    title: "AIIS_L2_LAB01 規格變更實戰"
    subtitle: "Add Last-Updated Feature via OpenSpec & Git"
    type: "lab"
    avatar: "avatar_laptop.png"
    callout: "完整走一遍規格驅動開發！"

  - id: 19
    title: "前四課主線進程與下課預告"
    subtitle: "BUILD (L1) -> MANAGE (L2) -> UNDERSTAND (L3) -> SECURE (L4)"
    type: "roadmap"
    roadmap: "L1 建置 -> L2 管控 -> L3 理解資料流 -> L4 源碼掃描"
    avatar: "avatar_welcome.png"
    callout: "下一課：理解 Python、FastAPI 與資料流 (L3)！"

  - id: 20
    title: "總結金句：規格為本，決策在人"
    subtitle: "Final Message & Closing"
    type: "closing"
    quote: "“SPEC DEFINES. AI IMPLEMENTS. HUMAN VERIFIES. GIT REMEMBERS.”"
    avatar: "huange_portrait.png"
    callout: "See you in AIIS_L3!"
