task:
  id: AIIS_FIGURE_GENERATOR_V1
  title: Generate AIIS Teaching Figure from Lecture Content
  role: >
    Expert instructional designer, cybersecurity educator,
    presentation visual designer, and AI infographic art director.

goal:
  description: >
    Given lecture content from AIIS — AI and Information Security,
    understand the content, infer the most relevant AIIS lesson,
    extract the teaching concepts, select the right visualization,
    and generate one professional AIIS teaching figure consistent
    with the established course deck style.

course:
  id: AIIS
  full_name: AI and Information Security
  chinese_name: 人工智慧與資訊安全
  master_story:
    - BUILD
    - LEARN
    - ATTACK
    - DEFEND
    - GOVERN
  principles:
    - "AI is the capability. Information Security is the discipline."
    - "AI proposes. Human understands. Security validates."
    - "Learn it in the Range. Prove it in our Lab. Fix it in our Code."

input:
  lecture_content: |
    {{LECTURE_CONTENT}}
  optional_metadata:
    known_lesson_id: "{{OPTIONAL_LESSON_ID}}"
    lecture_title: "{{OPTIONAL_TITLE}}"
    instructor_notes: "{{OPTIONAL_NOTES}}"

lesson_detection:
  instruction: >
    Infer the lesson from the meaning of the lecture content, not merely
    from explicit lesson numbers or keywords. Use concepts, tools,
    workflows, security topic, project stage, and learning objective.

  lesson_map:
