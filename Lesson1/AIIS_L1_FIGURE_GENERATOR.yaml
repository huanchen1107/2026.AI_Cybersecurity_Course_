task:
  id: AIIS_L1_FIGURE_GENERATOR_V1
  title: Generate AIIS_L1 Master Teaching Infographic
  role: >
    Expert instructional designer, cybersecurity educator,
    presentation visual designer, and AI infographic art director.

lesson:
  id: AIIS_L1
  full_name: "BUILD: Build Your First AI Weather Security Center"
  chinese_name: "AI 資安工程師的第一堂課：建立你的第一個 AI 氣象資安監控中心"
  slogan: "WORKING ≠ SECURE | AI BUILDS. HUMAN VERIFIES."
  grid_layout: "5 columns × 4 rows (20 Panels Master Summary Thumbnail)"

panels:
  # Row 1: The Build Journey (01 - 05)
  - id: 1
    title: "AIIS_L1 封面"
    subtitle: "AI 資安工程師的第一堂課"
    type: "cover"
    hero: "Build Your First AI Weather Security Center"
    avatar: "huange_portrait.png"
    callout: "Welcome to AIIS_L1!"

  - id: 2
    title: "課程大綱"
    subtitle: "Course Overview"
    type: "agenda"
    bullets:
      - "1. Prompt to Working App"
      - "2. CWA Real Data Integration"
      - "3. WORKING vs. SECURE ?"
      - "4. Asset / Threat / Vuln / Risk"
      - "5. CIA Triad in Action"
      - "6. AI Role Switch: Builder -> Analyst"
      - "7. AIIS_L1_LAB01 Mini Lab"
    avatar: "avatar_welcome.png"
    callout: "Let's build!"

  - id: 3
    title: "從提示詞到可運行系統"
    subtitle: "One Prompt -> One Real Website"
    type: "concept"
    flow: "Structured Prompt -> Antigravity Agent -> Working Weather App"
    callout: "Prompt is Engineering!"
    avatar: "avatar_idea.png"

  - id: 4
    title: "認識你的 AI 協作代理"
    subtitle: "Meet Antigravity & AI Agents"
    type: "toolchain"
    items:
      - "Planning (規劃架構)"
      - "Coding (生成後端與資料庫)"
      - "Tool Execution (執行終端機)"
      - "Browser Verification (自動驗證)"
    avatar: "avatar_laptop.png"

  - id: 5
    title: "結構化建置提示詞"
    subtitle: "The Structured Build Prompt"
    type: "prompt"
    components:
      - "Role: Senior Full-Stack Engineer"
      - "Goal: Weather Security Center"
      - "Stack: FastAPI + SQLite + CWA Data"
      - "Boundary: Localhost only"
    callout: "寫好 Prompt，系統不走鐘！"
    avatar: "avatar_explain.png"

  # Row 2: Real Data & The Security Turn (06 - 10)
  - id: 6
    title: "觀看 Agent 自主建置"
    subtitle: "Watch the Agent Work"
    type: "workflow"
    status: "FASTAPI + SQLITE + HTML5 DASHBOARD"
    terminal: "uvicorn app:main --reload --port 8000"
    avatar: "avatar_laptop.png"
    callout: "AI 快速建置中..."

  - id: 7
    title: "成果展示：系統跑起來了！"
    subtitle: "It Runs! localhost:8000"
    type: "showcase"
    features:
      - "即時氣象儀表板 (Live Weather)"
      - "警報預警中心 (Alert Hub)"
      - "使用者登入與權限管理"
    avatar: "avatar_present.png"
    callout: "It's Alive! 🚀"

  - id: 8
    title: "中央氣象署 CWA Real Data"
    subtitle: "Real Data, Not a Toy"
    type: "data"
    source: "中央氣象署 (CWA) Open Data API"
    data_points:
      - "氣溫 (Temperature)"
      - "濕度 (Humidity)"
      - "降雨量 (Rainfall)"
      - "天氣警報 (Weather Alerts)"
    avatar: "avatar_welcome.png"
    callout: "真實資料，真實應用！"

  - id: 9
    title: "關鍵思考轉折點"
    subtitle: "WORKING ✓ vs. SECURE ?"
    type: "turning_point"
    contrast:
      left: "功能正常 (Working) — 能跑能查"
      right: "安全防護 (Secure) — 存在隱藏漏洞？"
    avatar: "avatar_inspect.png"
    callout: "能跑 ≠ 安全！"

  - id: 10
    title: "資產偵探：我們在保護什麼？"
    subtitle: "Security Starts with Assets"
    type: "framework"
    assets:
      - "氣象伺服器 (Server)"
      - "CWA API Key (憑證)"
      - "SQLite 資料庫 (Database)"
      - "使用者帳號密碼 (Identity)"
    avatar: "avatar_inspect.png"
    callout: "沒有 Asset，就沒有 Risk！"

  # Row 3: Threat, Vulnerability & CIA Triad (11 - 15)
  - id: 11
    title: "什麼會造成危害？(Threat)"
    subtitle: "What Can Go Wrong? — Threat"
    type: "threat"
    threats:
      - "惡意大量請求 (DDoS / DoS)"
      - "API Key 遭盜用 (Credential Theft)"
      - "SQL Injection 注入攻擊"
      - "資料篡改 (Data Tampering)"
    avatar: "avatar_inspect.png"

  - id: 12
    title: "為什麼會成功？(Vulnerability)"
    subtitle: "Why Could It Succeed? — Vulnerability"
    type: "vuln"
    vulnerabilities:
      - "硬編碼 API Key (Hardcoded Secret)"
      - "缺乏 Rate Limiting 速率限制"
      - "未過濾使用者輸入 (Raw Input)"
    avatar: "avatar_explain.png"
    callout: "Bug ≠ Vulnerability！"

  - id: 13
    title: "威脅 vs. 弱點的本質差異"
    subtitle: "Threat ≠ Vulnerability"
    type: "concept"
    comparison:
      threat: "外在危險 (惡意攻擊者、惡劣環境)"
      vuln: "內部破洞 (程式碼漏洞、配置錯誤)"
    formula: "Risk = Threat × Vulnerability × Impact"
    avatar: "avatar_idea.png"

  - id: 14
    title: "CIA Triad 在氣象系統的實踐"
    subtitle: "Confidentiality, Integrity, Availability"
    type: "cia"
    pillars:
      - "C (機密性): 確保 API Key 與密碼不外洩"
      - "I (完整性): 確保氣象預報數據不被竄改"
      - "A (可用性): 確保天災發生時服務不中斷"
    avatar: "avatar_inspect.png"
    callout: "Security = Trust!"

  - id: 15
    title: "從弱點到風險評級"
    subtitle: "From Vulnerability to Risk"
    type: "matrix"
    matrix:
      likelihood: "發生機率 (Likelihood)"
      impact: "損害衝擊 (Impact)"
      levels: "CRITICAL / HIGH / MEDIUM / LOW"
    avatar: "avatar_laptop.png"

  # Row 4: AI Review, Lab & Next (16 - 20)
  - id: 16
    title: "AI 角色切換：Builder → Analyst"
    subtitle: "AI Changes Role: Security Reviewer"
    type: "role_switch"
    roles:
      builder: "建置者：生成代碼、寫測試"
      analyst: "審計者：找漏洞、做威脅分析"
    avatar: "avatar_explain.png"
    callout: "讓 AI 成為你的安全顧問！"

  - id: 17
    title: "實證原則：不盲信 AI 結論"
    subtitle: "AI Finding ≠ Confirmed Finding"
    type: "epistemic"
    rules:
      - "要求具體 Evidence (代碼行號、請求範例)"
      - "區分 Fact (事實) vs. Assumption (假設)"
      - "由人類工程師進行最終判定與簽核"
    avatar: "avatar_inspect.png"
    callout: "AI 提議，人類驗證！"

  - id: 18
    title: "AIIS_L1_LAB01 實戰任務"
    subtitle: "AI Security Risk Detective Lab"
    type: "lab"
    tasks:
      - "1. 運行氣象中心服務"
      - "2. 啟動 AI Security Review Prompt"
      - "3. 填寫資安風險偵探報告表"
      - "4. 驗證並記錄 Evidence"
    avatar: "avatar_laptop.png"
    callout: "Let's code & verify!"

  - id: 19
    title: "全學期主線與 L2 預告"
    subtitle: "Our Learning Journey & Next Step"
    type: "roadmap"
    roadmap: "BUILD (L1-L3) -> LEARN -> ATTACK -> DEFEND -> GOVERN"
    next: "下一課 AIIS_L2：AI Security Toolbox & Git Workflow"
    avatar: "avatar_welcome.png"
    callout: "Next Level!"

  - id: 20
    title: "最後的話：WORKING ≠ SECURE"
    subtitle: "Final Message & Closing"
    type: "closing"
    quote: "“AI BUILDS. HUMAN VERIFIES. Learn it in the Range. Fix it in our Code.”"
    avatar: "huange_portrait.png"
    callout: "See you in AIIS_L2!"
